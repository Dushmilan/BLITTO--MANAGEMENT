name: test

on:
  push:
  pull_request:

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: pip install -e ".[dev]"
      - name: Full suite with coverage gate
        # Journeys boot their own live uvicorn; request API needs no browsers.
        run: pytest tests/ --cov=app --cov-report=term-missing -q

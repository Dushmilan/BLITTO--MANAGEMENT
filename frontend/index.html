    <script>
      // Pre-paint theme: apply the stored/OS dark class before first render
      // so toggling never flashes the wrong theme.
      try {
        var t = localStorage.getItem('blitto-theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
